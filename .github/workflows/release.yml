name: Release

on:
  schedule:
    # Раз в неделю, по понедельникам в 06:00 UTC (09:00 по Москве). Cron в GitHub Actions задаётся в UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  INITIAL_RELEASE_VERSION: 0.0.1-alpha.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Определить версию
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      should-release: ${{ steps.release-version.outputs.should-release }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Определить следующую версию
        id: release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_RELEASE_VERSION: ${{ env.INITIAL_RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'alpha' }}
        run: |
          set -euo pipefail
          # Версия строится от последнего релиза по дате создания тега. Сортировка по номеру
          # здесь не годится: старые теги v1.x от другой линии дают номер выше текущего 0.0.x.
          last_tag="$(git tag --list 'v*' --sort=-creatordate | head -n 1 || true)"
          last_version="${last_tag#v}"
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            latest_alpha_tag="$(git tag --list 'v*-alpha.*' --sort=-creatordate | head -n 1 || true)"
            if [ -n "$latest_alpha_tag" ]; then
              stable_version="${latest_alpha_tag#v}"
              stable_version="${stable_version%-alpha.*}"
            elif [ -n "$last_tag" ]; then
              stable_version="$last_version"
            else
              stable_version="${INITIAL_RELEASE_VERSION%-alpha.*}"
            fi
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "version=$stable_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Плановый alpha-релиз выходит только если дерево изменилось после последнего релиза.
          if [ -n "$last_tag" ] && git diff --quiet "$last_tag" HEAD; then
            echo "Изменений после $last_tag нет, релиз не выходит."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$last_version" == *-alpha.* ]]; then
            # Идёт alpha-цикл: основа та же, меняется только номер alpha.
            base_version="${last_version%-alpha.*}"
          elif [ -n "$last_tag" ]; then
            # Последний релиз стабильный: следующий alpha-цикл начинается с патча + 1.
            base_version="$(node --input-type=module -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log([major, minor, patch + 1].join('.'))" "$last_version")"
          else
            base_version="${INITIAL_RELEASE_VERSION%-alpha.*}"
          fi
          # До Stable увеличивается только следующий alpha number.
          alpha_tag="$(git tag --list "v${base_version}-alpha.*" | sort -V | tail -n 1 || true)"
          alpha_number=1
          if [ -n "$alpha_tag" ]; then
            alpha_number="$(( ${alpha_tag##*.} + 1 ))"
          fi
          echo "should-release=true" >> "$GITHUB_OUTPUT"
          echo "version=${base_version}-alpha.${alpha_number}" >> "$GITHUB_OUTPUT"

  build:
    name: Собрать ${{ matrix.platform }}
    if: needs.version.outputs.should-release == 'true'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.yml
          - platform: macOS
            runner: macos-latest
            command: npm run dist:mac
            artifact-path: |
              dist/*.dmg
              dist/*.zip
              dist/*.yml
          - platform: Windows
            runner: windows-latest
            command: npm run dist:windows
            artifact-path: |
              dist/*.exe
              dist/*.blockmap
              dist/*.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить версию сборки
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').version")" != "$RELEASE_VERSION" ]; then
            npm version --no-git-tag-version "$RELEASE_VERSION"
          fi

      - name: Собрать установщик
        shell: bash
        run: |
          # Пустая строка вместо отсутствующего секрета ломает electron-builder:
          # CSC_LINK="" разрешается в корень репозитория ("not a file").
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              unset "$name"
            fi
          done
          ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      - name: Сохранить установщики
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Опубликовать релиз
    if: needs.version.outputs.should-release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Скачать установщики
        uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Создать тег и опубликовать релиз
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          INITIAL_RELEASE_VERSION: ${{ env.INITIAL_RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'alpha' }}
        run: |
          set -euo pipefail
          # Версия пишется только в рабочую копию: правила репозитория запрещают прямые
          # пуши в ветки, поэтому коммит с версией и CHANGELOG в master не создаётся.
          node --input-type=module -e "import fs from 'node:fs'; const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8')); packageJson.version = process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\\n');"
          npx conventional-changelog -p conventionalcommits -o release-notes.md -r 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${RELEASE_VERSION}" -m "Релиз ${RELEASE_VERSION}"
          git push origin "refs/tags/v${RELEASE_VERSION}"
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            gh release create "v${RELEASE_VERSION}" release-assets/* \
              --title "${RELEASE_VERSION}" --notes-file release-notes.md
          else
            gh release create "v${RELEASE_VERSION}" release-assets/* \
              --title "${RELEASE_VERSION}" --prerelease --notes-file release-notes.md
          fi
