name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  INITIAL_RELEASE_VERSION: 0.0.1-alpha.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Определить версию
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      should-release: ${{ steps.release-version.outputs.should-release }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Определить следующую версию
        id: release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_RELEASE_VERSION: ${{ env.INITIAL_RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'alpha' }}
        run: |
          set -o pipefail
          if [ "$RELEASE_CHANNEL" = "alpha" ] && ! git rev-parse "v${INITIAL_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "version=${INITIAL_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_log="$(mktemp)"
          npx semantic-release --dry-run 2>&1 | tee "$release_log"
          base_version="$(sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$release_log" | tail -n 1)"
          if [ -z "$base_version" ]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should-release=true" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            echo "version=$base_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          alpha_tag="$(git tag --list "v${base_version}-alpha.*" | sort -V | tail -n 1)"
          alpha_number=1
          if [ -n "$alpha_tag" ]; then
            alpha_number="$(( ${alpha_tag##*.} + 1 ))"
          fi
          echo "version=${base_version}-alpha.${alpha_number}" >> "$GITHUB_OUTPUT"

  build:
    name: Собрать ${{ matrix.platform }}
    if: needs.version.outputs.should-release == 'true'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
          - platform: macOS
            runner: macos-latest
            command: npm run dist:mac
            artifact-path: |
              dist/*.dmg
              dist/*.zip
          - platform: Windows
            runner: windows-latest
            command: npm run dist:windows
            artifact-path: |
              dist/*.exe
              dist/*.blockmap
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить версию сборки
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').version")" != "$RELEASE_VERSION" ]; then
            npm version --no-git-tag-version "$RELEASE_VERSION"
          fi

      - name: Собрать установщик
        run: ${{ matrix.command }}

      - name: Сохранить установщики
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Опубликовать релиз
    if: needs.version.outputs.should-release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Скачать установщики
        uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Создать тег и опубликовать релиз
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          INITIAL_RELEASE_VERSION: ${{ env.INITIAL_RELEASE_VERSION }}
          RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'alpha' }}
        run: |
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            npx semantic-release
            exit 0
          fi
          node --input-type=module -e "import fs from 'node:fs'; const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8')); packageJson.version = process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\\n');"
          if [ "$RELEASE_VERSION" = "$INITIAL_RELEASE_VERSION" ] && ! git rev-parse "v${INITIAL_RELEASE_VERSION}" >/dev/null 2>&1; then
            npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s -r 0
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md package.json
            git commit -m "chore: подготовить релиз ${RELEASE_VERSION} [skip ci]"
            git tag -a "v${RELEASE_VERSION}" -m "Релиз ${RELEASE_VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
            gh release create "v${RELEASE_VERSION}" release-assets/* \
              --title "${RELEASE_VERSION}" --prerelease --generate-notes
          else
            npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s -r 0
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md package.json
            git commit -m "chore: подготовить prerelease ${RELEASE_VERSION} [skip ci]"
            git tag -a "v${RELEASE_VERSION}" -m "Релиз ${RELEASE_VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
            gh release create "v${RELEASE_VERSION}" release-assets/* \
              --title "${RELEASE_VERSION}" --prerelease --generate-notes
          fi

      - name: Обновить версию package.json
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8')); packageJson.version = process.env.RELEASE_VERSION; fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\\n');"
          if git diff --quiet -- package.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore: обновить версию до ${RELEASE_VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
