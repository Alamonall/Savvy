name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Определить версию
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Определить следующую версию
        id: release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          release_log="$(mktemp)"
          npx semantic-release --dry-run 2>&1 | tee "$release_log"
          version="$(sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$release_log" | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Собрать ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            command: npm run dist:linux
          - platform: macOS
            runner: macos-latest
            command: npm run dist:mac
          - platform: Windows
            runner: windows-latest
            command: npm run dist:windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить версию сборки
        run: npm version --no-git-tag-version "${{ needs.version.outputs.version }}"

      - name: Собрать установщик
        run: ${{ matrix.command }}

      - name: Сохранить установщики
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Опубликовать релиз
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Скачать установщики
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Создать тег и опубликовать релиз
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
