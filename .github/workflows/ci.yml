name: CI

on:
  push:
    branches:
      - master
      - release/nightly
      - release/beta
  pull_request:
    branches:
      - master
      - release/nightly
      - release/beta

permissions:
  contents: read

jobs:
  quality:
    name: Проверить проект
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Настроить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: |
          export ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((15 * 2 ** (attempt - 1)))
              echo "npm ci failed (attempt $attempt/3); retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Проверить качество кода
        run: npm run quality:check

      - name: Запустить тесты
        run: npm test
