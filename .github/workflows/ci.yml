name: CI

on:
  push:
    branches:
      - main
      - master
      - release/nightly
      - release/beta
  pull_request:
    branches:
      - main
      - master
      - release/nightly
      - release/beta

permissions:
  contents: read

jobs:
  quality:
    name: Проверить проект
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить качество кода
        run: npm run quality:check

      - name: Запустить тесты
        run: npm test
